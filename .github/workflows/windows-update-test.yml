name: Windows update verification
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release containing the signed Windows installer
        required: true
        type: string
permissions:
  contents: read
jobs:
  native-update:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Download release fixtures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern '*windows-x64.exe' --pattern 'latest-windows.json' --dir "$env:RUNNER_TEMP/obla-release"
      - name: Verify signed updater and native installer
        shell: pwsh
        run: |
          node --test tests/windows.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/windows-install-e2e.cjs "$env:RUNNER_TEMP/obla-release"
