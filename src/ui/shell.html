<!doctype html>
<html lang="ru"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Обла</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="shell.css"><script src="shell.js" defer></script>
</head><body class="loading">
  <aside aria-label="Аккаунты мессенджеров">
    <header class="sidebar-header">
      <div class="brand" aria-label="Обла">
        <svg class="brand-mark" viewBox="0 0 1024 1024" aria-hidden="true"><path transform="translate(0 1024) scale(1 -1)" d="M592 350H347C272 350 217 407 217 478C217 544 264 597 327 605C345 687 414 740 499 740C584 740 654 687 671 609C747 604 807 546 807 471C807 404 761 350 695 350L633 290"/></svg>
        <h1>Обла</h1>
      </div>
      <button id="collapse" class="collapse" title="Свернуть панель" aria-label="Свернуть панель" aria-expanded="true" aria-controls="accounts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/><path class="collapse-chevron" d="m16 9-3 3 3 3"/></svg>
      </button>
    </header>
    <div class="section-heading"><span>АККАУНТЫ</span><span title="Переключение аккаунтов">⌘1–9</span></div>
    <nav id="accounts" aria-label="Переключение аккаунтов"></nav>
    <section id="account-picker" aria-label="Добавить аккаунт" hidden>
      <div class="picker-heading"><strong>Добавить аккаунт</strong><button id="picker-close" type="button" aria-label="Закрыть выбор мессенджера">×</button></div>
      <button type="button" data-service="max"><span class="picker-icon max-icon" aria-hidden="true">M</span><span><strong>MAX</strong><small>Войти в аккаунт MAX</small></span><span aria-hidden="true">›</span></button>
      <button type="button" data-service="telegram"><span class="picker-icon telegram-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 11 17-7-4 16-5-5 5-6-7 5-6-3Z"/></svg></span><span><strong>Telegram</strong><small>Войти в Telegram Web</small></span><span aria-hidden="true">›</span></button>
      <button type="button" data-service="whatsapp"><span class="picker-icon whatsapp-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.4-4.2A8 8 0 1 1 20 11.5Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 7c0 5 4 8 8 8l1-2-3-1-1 1-3-3 1-1-1-3Z"/></svg></span><span><strong>WhatsApp</strong><small>Войти в WhatsApp Web</small></span><span aria-hidden="true">›</span></button>
      <button type="button" data-service="vk"><span class="picker-icon vk-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 5h4c.2 5 1.5 8 3 8V5h4v5c1.6-.5 3.4-3 4-5h4c-.7 3-2.7 5.5-4.5 7 2 1.3 4.2 4 4.8 7H18c-.7-2-2.5-4-4-4v4h-2C6 19 3 14 3 5Z"/></svg></span><span><strong>VK Мессенджер</strong><small>Войти через VK ID</small></span><span aria-hidden="true">›</span></button>
    </section>
    <form id="account-form" hidden>
      <label for="account-name" id="form-title">Настройки аккаунта</label>
      <input id="account-name" type="text" maxlength="40" placeholder="Например, Рабочий" autocomplete="off" required>
      <button id="profile-name" type="button" hidden>Использовать имя MAX</button>
      <button id="logout-account" type="button" class="logout-account" hidden>Выйти из аккаунта</button>
      <div><button id="cancel" type="button">Отмена</button><button class="accent" type="submit" id="save">Добавить</button></div>
    </form>
    <p id="error" role="status" aria-live="polite"></p>
    <button id="add" class="add" title="Добавить аккаунт" aria-label="Добавить аккаунт"><span aria-hidden="true">＋</span><span class="add-label">Добавить аккаунт</span></button>
    <div class="bottom">
      <button id="update-alert" hidden>Доступно обновление <span aria-hidden="true">↗</span></button>
      <button id="lock" class="settings" title="Экран блокировки · ⌘L" hidden><span aria-hidden="true">▣</span><span>Экран блокировки</span></button>
      <button id="settings" class="settings" title="Настройки и обновления" aria-label="Настройки и обновления"><span aria-hidden="true">⚙</span><span>Настройки и обновления</span></button>
      <footer><span id="version">Обла</span><span>Intel · Apple Silicon</span></footer>
    </div>
  </aside>
<main id="empty-state" hidden><section><h2>Добавьте аккаунт</h2><p>Выберите MAX, Telegram, WhatsApp или VK. Имя и фото появятся после входа.</p><button id="empty-add" class="touch-primary">Добавить аккаунт</button></section></main>
<main id="lock-screen" hidden aria-labelledby="lock-title">
    <section class="lock-card">
      <img class="lock-logo" src="../../assets/icon.png" alt="" width="52" height="52">
      <p class="lock-eyebrow">ДОСТУП К АККАУНТАМ</p>
      <h2 id="lock-title">Разблокировать «Обла»</h2>
      <p id="lock-description">Введите код доступа</p>
      <button id="touch-id" class="touch-primary" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5a7 7 0 0 1 11 6v3M5 8a7 7 0 0 0-1 4v3M8 20c2-3 2-5 2-8a2 2 0 0 1 4 0c0 5-1 8-3 10M7 16v-4a5 5 0 0 1 10 0c0 4-.5 7-2 10M20 18l-1 3M4 19l-1 2"/></svg><span id="touch-id-label">Разблокировать с Touch ID</span></button>
      <div id="code-divider" class="code-divider" hidden><span>или используйте код</span></div>
      <form id="unlock-form"><label for="unlock-pin">Код доступа</label><div class="code-entry"><input id="unlock-pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="off" placeholder="Введите код" required><button id="unlock" type="submit" title="Разблокировать кодом" aria-label="Разблокировать кодом"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></div></form>
      <p id="unlock-error" role="status" aria-live="polite"></p>
      <p class="lock-footnote">Ваши аккаунты под защитой</p>
    </section>
  </main>
</body></html>
